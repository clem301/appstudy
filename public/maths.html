<title>Maths Jury CESS</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: copie d'examen quadrillée — colonne de lecture 900px, rail de chapitres à gauche sur PC */
:root{
  --bg:#f6f6fb; --paper:#ffffff; --ink:#1c1b2e; --muted:#5d5b78; --line:#e3e1ef; --grid:#efd7ef;
  --accent:#8a2a8a; --accent-ink:#ffffff; --accent-soft:#f6e6f6;
  --ok:#1f7a4d; --ok-soft:#e1f3ea; --mid:#9a6200; --mid-soft:#fbf0d9; --ko:#b3261e; --ko-soft:#fbe5e3;
  --code:#f1f0f8;
  --f-display:"Familjen Grotesk",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14131f; --paper:#1d1c2b; --ink:#ecebf5; --muted:#a6a3c2; --line:#302e45; --grid:#3a2440;
  --accent:#e08fe0; --accent-ink:#1d0f1d; --accent-soft:#3a2240;
  --ok:#6fd3a0; --ok-soft:#173528; --mid:#f0c060; --mid-soft:#3a2e12; --ko:#ff8a80; --ko-soft:#3d1c1a; --code:#262537; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131f; --paper:#1d1c2b; --ink:#ecebf5; --muted:#a6a3c2; --line:#302e45; --grid:#3a2440;
  --accent:#e08fe0; --accent-ink:#1d0f1d; --accent-soft:#3a2240;
  --ok:#6fd3a0; --ok-soft:#173528; --mid:#f0c060; --mid-soft:#3a2e12; --ko:#ff8a80; --ko-soft:#3d1c1a; --code:#262537; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{position:static!important;max-height:none!important}}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:4px 0 2px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:7px 10px;border-radius:8px;cursor:pointer}
.nav:hover{background:var(--accent-soft)}
.nav.on{background:var(--accent);color:var(--accent-ink)}
.nav .n{font-family:var(--f-mono);font-size:12px;opacity:.75;min-width:22px}
.nav .bar{margin-left:auto;width:38px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.nav .bar i{display:block;height:100%;background:var(--ok)}
.nav.on .bar{background:rgba(255,255,255,.35)}
.sep{height:1px;background:var(--line);margin:8px 0}
main{min-width:0}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px;margin-top:28px;margin-bottom:10px}
h3{font-size:18px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);max-width:68ch;margin:8px 0 0}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-color:var(--paper)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;font:inherit;font-size:15px;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.mid{background:var(--mid-soft);color:var(--mid);border-color:var(--mid)}
.btn.ko{background:var(--ko-soft);color:var(--ko);border-color:var(--ko)}
.btn:focus-visible,.nav:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.chip{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.off{background:var(--code);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.mid{background:var(--mid-soft);color:var(--mid)} .chip.ko{background:var(--ko-soft);color:var(--ko)}
.recipe{border-left:4px solid var(--accent);border-radius:0;padding:4px 0 4px 16px}
.recipe h3{margin-bottom:4px}
.recipe .when{color:var(--muted);font-size:15px;margin:0 0 8px}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
ol.steps>li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:2px}
.trap{background:var(--ko-soft);border-radius:8px;padding:10px 14px;font-size:15px}
.trap b{color:var(--ko)}
.memo{background:var(--code);border-radius:8px;padding:10px 14px;font-size:15px}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t td,table.t th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--code);font-weight:700}
.tw{overflow-x:auto}
.ex{display:flex;flex-direction:column;gap:12px}
.ex .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ex .head h3{flex:1;min-width:200px}
.stepbox{display:flex;flex-direction:column;gap:8px}
.step{background:var(--code);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.step .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:3px;white-space:nowrap}
.answer{background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:10px 14px}
.answer b{color:var(--ok)}
.fig{max-width:460px}
.fig svg{width:100%;height:auto;display:block}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.flash .q{font-size:21px;line-height:1.45}
.flash .a{border-top:1px dashed var(--line);padding-top:14px;font-size:18px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.plan li{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.plan{list-style:none;margin:0;padding:0}
.plan .t{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.plan input{width:18px;height:18px;accent-color:var(--accent)}
.plan .done{opacity:.55;text-decoration:line-through}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.ntab{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.ntab td,.ntab th{padding:3px 6px;text-align:right}
.muted{color:var(--muted)}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
mjx-container[display="true"]{margin:.5em 0!important}
p{margin:0 0 8px}
ul{margin:0;padding-left:20px}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .18s ease-out}@keyframes f{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},startup:{typeset:false}};
</script>

<body>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Chapitres"></nav>
  <main id="app"></main>
</div>

<script>
const R=String.raw;

/* ---------- Graphiques ---------- */
function plot(o){
  const W=o.w||420,H=o.h||280,[x0,x1]=o.x,[y0,y1]=o.y,P=22;
  const sx=x=>P+(x-x0)/(x1-x0)*(W-2*P), sy=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'graphique'}" style="font-family:var(--f-mono)">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--paper)"/>`;
  const st=o.step||1;
  for(let x=Math.ceil(x0/st)*st;x<=x1+1e-9;x+=st)s+=`<line x1="${sx(x)}" y1="${sy(y0)}" x2="${sx(x)}" y2="${sy(y1)}" stroke="var(--grid)" stroke-width="1"/>`;
  const sty=o.ystep||st;
  for(let y=Math.ceil(y0/sty)*sty;y<=y1+1e-9;y+=sty)s+=`<line x1="${sx(x0)}" y1="${sy(y)}" x2="${sx(x1)}" y2="${sy(y)}" stroke="var(--grid)" stroke-width="1"/>`;
  if(o.fill){const f=o.fill;let d=`M${sx(f.a)},${sy(0)}`;for(let i=0;i<=120;i++){const x=f.a+(f.b-f.a)*i/120;d+=` L${sx(x)},${sy(f.f(x))}`}d+=` L${sx(f.b)},${sy(0)} Z`;s+=`<path d="${d}" fill="var(--accent-soft)" stroke="none"/>`}
  if(y0<=0&&y1>=0)s+=`<line x1="${sx(x0)}" y1="${sy(0)}" x2="${sx(x1)}" y2="${sy(0)}" stroke="var(--ink)" stroke-width="1.4"/>`;
  if(x0<=0&&x1>=0&&!o.noYaxis)s+=`<line x1="${sx(0)}" y1="${sy(y0)}" x2="${sx(0)}" y2="${sy(y1)}" stroke="var(--ink)" stroke-width="1.4"/>`;
  const xt=o.xticks||(o.nolabels?[]:range(x0,x1,o.lx||st).map(v=>[v,fmt(v)]));
  xt.forEach(([v,l])=>{if(v===0&&!o.xticks)return;s+=`<text x="${sx(v)}" y="${Math.min(H-4,sy(0)+14)}" font-size="11" text-anchor="middle" fill="var(--muted)">${l}</text>`});
  const yt=o.yticks||(o.nolabels?[]:range(y0,y1,o.ly||sty).map(v=>[v,fmt(v)]));
  const yx=(x0<=0&&x1>=0)?sx(0):sx(x0);
  yt.forEach(([v,l])=>{if(v===0)return;s+=`<text x="${yx-5}" y="${sy(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${l}</text>`});
  (o.vl||[]).forEach(v=>s+=`<line x1="${sx(v)}" y1="${sy(y0)}" x2="${sx(v)}" y2="${sy(y1)}" stroke="var(--ko)" stroke-dasharray="5 4" stroke-width="1.4"/>`);
  (o.hl||[]).forEach(v=>s+=`<line x1="${sx(x0)}" y1="${sy(v)}" x2="${sx(x1)}" y2="${sy(v)}" stroke="var(--ko)" stroke-dasharray="5 4" stroke-width="1.4"/>`);
  (o.fns||[]).forEach(fn=>{const f=typeof fn==='function'?fn:fn.f;const a=fn.a??x0,b=fn.b??x1;let d='',pen=false,py=null;
    for(let i=0;i<=600;i++){const x=a+(b-a)*i/600;const y=f(x);
      if(!isFinite(y)||y<y0-(y1-y0)||y>y1+(y1-y0)||(py!==null&&Math.abs(y-py)>(y1-y0)*0.9)){pen=false;py=isFinite(y)?y:null;continue}
      const Y=Math.max(y0-(y1-y0)*.2,Math.min(y1+(y1-y0)*.2,y));d+=(pen?' L':' M')+sx(x).toFixed(1)+','+sy(Y).toFixed(1);pen=true;py=y}
    s+=`<path d="${d}" fill="none" stroke="${fn.c||'var(--ink)'}" stroke-width="2.2" ${fn.dash?'stroke-dasharray="6 4"':''}/>`});
  (o.pts||[]).forEach(([x,y,l])=>{s+=`<circle cx="${sx(x)}" cy="${sy(y)}" r="4" fill="${o.ptc||'var(--accent)'}"/>`;if(l)s+=`<text x="${sx(x)+6}" y="${sy(y)-6}" font-size="11" fill="var(--ink)">${l}</text>`});
  if(o.title)s+=`<text x="${P}" y="14" font-size="12" fill="var(--ink)" font-weight="600">${o.title}</text>`;
  return s+'</svg>';
}
function range(a,b,st){const r=[];for(let v=Math.ceil(a/st)*st;v<=b+1e-9;v+=st)r.push(+v.toFixed(6));return r}
function fmt(v){return String(+v.toFixed(2)).replace('.',',')}
const PI=Math.PI, pdf=(m,s)=>x=>Math.exp(-(((x-m)/s)**2)/2)/(s*Math.sqrt(2*PI));
const piTicks=(n,d,lab)=>{const r=[];for(let k=0;k<=n;k++)r.push([k*PI/d,lab(k)]);return r};

const PLOTS={
  q1:()=>plot({x:[-0.5,5.5],y:[8,9.1],ystep:0.1,ly:0.1,step:1,pts:[[0,8.1],[1,8.3],[2,8.5],[3,8.7],[5,8.9]],xticks:[[0,'2014'],[1,'2015'],[2,'2016'],[3,'2017'],[4,'2018'],[5,'2019']],label:'salaire minimum horaire'}),
  q1s:()=>plot({x:[-0.5,5.5],y:[8,9.1],ystep:0.1,ly:0.1,pts:[[0,8.1],[1,8.3],[2,8.5],[3,8.7],[5,8.9],[4,8.79,'estimation 8,79']],xticks:[[0,'2014'],[1,'2015'],[2,'2016'],[3,'2017'],[4,'2018'],[5,'2019']],fns:[{f:t=>0.16216*t+8.14324,c:'var(--accent)'}]}),
  cA:()=>plot({w:240,h:200,x:[0,9],y:[0,10],nolabels:true,title:'A',pts:[[1,2.1],[2,3],[3,3.9],[4,5.2],[5,6],[6,6.8],[7,8.1],[8,9]]}),
  cB:()=>plot({w:240,h:200,x:[0,9],y:[0,10],nolabels:true,title:'B',pts:[[1,9],[2,8.2],[3,7.5],[4,5.9],[5,5.5],[6,3.8],[7,3.4],[8,1.9]]}),
  cC:()=>plot({w:240,h:200,x:[0,9],y:[0,10],nolabels:true,title:'C',pts:[[1,3],[2,2],[3,5],[4,3.5],[5,6],[6,4.5],[7,7.5],[8,6]]}),
  cD:()=>plot({w:240,h:200,x:[0,9],y:[0,10],nolabels:true,title:'D',pts:[[1,5],[2,2],[3,7],[4,4],[5,3],[6,8],[7,4.5],[8,5]]}),
  q32:()=>plot({x:[-8,9],y:[-7,5.5],fns:[x=>(x+4)/(2*x+1)],vl:[-0.5],hl:[0.5],pts:[[4,8/9]],label:'f(x)=(x+4)/(2x+1)'}),
  q41:()=>plot({x:[-3,5.5],y:[-3.5,4.5],fns:[x=>-x*(x-3)**2/4],pts:[[1,-1,'min (1;−1)'],[3,0,'max (3;0)']]}),
  g1:()=>plot({w:240,h:220,x:[-1.5,4.5],y:[-3.5,2.5],title:'Graphique 1',fns:[x=>-0.75*x*(x-3)]}),
  g2:()=>plot({w:240,h:220,x:[-1.5,4.5],y:[-3.5,2.5],title:'Graphique 2',fns:[x=>-0.75*(x-1)*(x-3)]}),
  g3:()=>plot({w:240,h:220,x:[-1.5,4.5],y:[-1.5,4.5],title:'Graphique 3',fns:[x=>0.75*(x-1)*(x-3)]}),
  q5:()=>plot({x:[-0.2,8.6],y:[-3,3],ystep:0.5,ly:1,step:PI/3,xticks:piTicks(8,3,k=>k===0?'0':k===3?'π':k===6?'2π':k+'π/3'),fns:[x=>2.5*Math.sin(1.5*x)],pts:[[PI/3,2.5,'max'],[PI,-2.5,'min (π ; −5/2)'],[7*PI/3,-2.5,'min (7π/3 ; −5/2)']],label:'f(x)=5/2 sin(3x/2)'}),
  sin2x:()=>plot({x:[-0.2,6.6],y:[-1.5,1.5],ystep:0.5,ly:1,step:PI/4,xticks:piTicks(8,4,k=>k===0?'0':k===4?'π':k===8?'2π':k%2===0?(k/2)+'π/2':k+'π/4'),fns:[x=>Math.sin(2*x)],label:'mystère'}),
  tide:()=>plot({x:[0,24],y:[0,5.5],step:3,ly:1,fns:[t=>2*Math.sin(PI*t/6)+3],hl:[4],pts:[[1,4,'t=1'],[5,4,'t=5']],label:'marée'}),
  b5:()=>plot({x:[-0.2,6.6],y:[-2.5,4.5],step:PI/4,ly:1,xticks:piTicks(8,4,k=>k===0?'0':k===4?'π':k===8?'2π':k%2===0?(k/2)+'π/2':k+'π/4'),fns:[x=>3*Math.cos(2*x)+1],hl:[1],label:'3cos(2x)+1'}),
  n72:()=>plot({x:[300,900],y:[0,0.0058],step:75,ystep:0.001,yticks:[],noYaxis:true,xticks:[[375,'375'],[450,'450'],[525,'525'],[600,'600'],[675,'675'],[750,'750'],[825,'825']],fns:[pdf(600,75)],fill:{f:pdf(600,75),a:450,b:750},label:'N(600;75), 95 % entre 450 et 750'}),
  n72b:()=>plot({x:[300,900],y:[0,0.0058],step:75,ystep:0.001,yticks:[],noYaxis:true,xticks:[[450,'450'],[550,'550'],[600,'600'],[800,'800']],fns:[pdf(600,75)],fill:{f:pdf(600,75),a:550,b:800},label:'P(550<X<800)'}),
  q83:()=>plot({x:[-4.5,5.5],y:[-3.5,2.5],fns:[{f:x=>x+1,a:-4,b:1},{f:x=>2-(x-1)/4,a:1,b:5}],pts:[[-4,-3],[1,2],[5,1]]}),
  q83s:()=>plot({x:[-4.5,5.5],y:[-3.5,2.5],fns:[{f:x=>x+1,a:-4,b:1},{f:x=>2-(x-1)/4,a:1,b:5}],fill:{f:x=>x<1?x+1:2-(x-1)/4,a:-1,b:5},pts:[[-1,0,'−1'],[1,2],[5,1]]}),
  e86:()=>plot({x:[-0.5,2.5],y:[-1.5,3.5],step:0.5,ly:1,lx:1,fns:[x=>x*x-1],fill:{f:x=>x*x-1,a:0,b:2}}),
  e85:()=>plot({x:[-2,3],y:[-1,5],fns:[x=>x*x,{f:x=>x+2,c:'var(--accent)'}],fill:{f:x=>x+2-x*x,a:-1,b:2},pts:[[-1,1],[2,4]]}),
  q9:()=>plot({x:[0,72],y:[-3,2.2],step:5,ystep:0.5,lx:10,ly:1,fns:[{f:x=>(2*x-30)*Math.exp(-0.1*x),a:1,b:70}],pts:[[25,1.64,'max (25 ; 1,64)'],[15,0,'15']]}),
  cube:()=>`<svg viewBox="0 0 300 230" role="img" aria-label="cube ABCDEFGH"><rect width="300" height="230" fill="var(--paper)"/>
